<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Max Ellis</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<style>
  :root { --paper: #FFFFFF; --ink: #0B0B0C; --ink-2: #4A4A4F; --rule: #6E6E73; --accent: #0B0B0C; --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0B0B0C; --ink: #F2F2F3; --ink-2: #A8A8AD; --rule: #8E8E93; --accent: var(--ink); } }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--paper); color: var(--ink); font: 16px/24px var(--sans); }
  main { max-width: 560px; }
  .code { font-family: var(--mono); font-size: 14px; color: var(--accent); margin: 0; }
  h1 { margin: 8px 0 16px; font-size: clamp(36px, 8vw, 56px); line-height: 1.05; letter-spacing: -0.03em; }
  p { margin: 0 0 24px; color: var(--ink-2); font-size: 18px; line-height: 28px; }
  .wave { display: block; width: 100%; height: 32px; color: var(--rule); margin-bottom: 24px; }
  nav { display: flex; flex-wrap: wrap; gap: 12px; }
  nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid var(--rule); border-radius: 2px; color: var(--ink); text-decoration: none; font-weight: 600; }
  nav a:first-child { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  nav a:hover { border-color: var(--ink); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">404 · silence</p>
  <h1>Nothing to hear here.</h1>
  <svg class="wave" viewBox="0 0 560 32" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 16H220Q232 2 244 16T268 16T292 16T316 16H560" fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>
  <p>That page doesn’t exist, or it has moved. Try one of these instead.</p>
  <nav aria-label="Site">
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/listen">Listen</a>
    <a href="/contact">Contact</a>
  </nav>
</main>
</body>
</html>
